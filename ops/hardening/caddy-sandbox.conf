# Песочница для Caddy (он единственный, кто принимает соединения из интернета на хабе): /etc/systemd/system/caddy.service.d/sandbox.conf
# Писать ему можно только в каталог сертификатов и логов, системные вызовы, пространства имён и устройства ограничены.
# Применение: systemctl daemon-reload && systemctl restart caddy; проверка: systemd-analyze security caddy.service
[Service]
NoNewPrivileges=yes
ProtectSystem=strict
ReadWritePaths=/var/lib/caddy /var/log/caddy
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
ProcSubset=pid
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources
SystemCallErrorNumber=EPERM
CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_BIND_SERVICE
UMask=0077
