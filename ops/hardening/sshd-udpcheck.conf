# Вход только по ключам, без лишних возможностей: пробросов портов, X11, агента, туннелей (на этих серверах они не нужны)
# Кладётся в /etc/ssh/sshd_config.d/10-udpcheck.conf (первое найденное значение побеждает, поэтому имя с «10»)
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
PermitTunnel no
LoginGraceTime 30
MaxAuthTries 4
ClientAliveInterval 120
ClientAliveCountMax 3
