# Автоперезапуск Caddy: /etc/systemd/system/caddy.service.d/restart.conf
# 19.10.2026 после нештатной перезагрузки хаба система грузилась 13 минут, старт Caddy упал по тайм-ауту, и сайт лежал, пока его не запустили вручную.
# Теперь при неудачном старте или падении (ненулевой код, сигнал, тайм-аут) systemd пробует снова через 10 с; ручная остановка (systemctl stop) не перезапускает.
# Применение: systemctl daemon-reload (перезапуск самого Caddy не нужен); проверка: systemctl show caddy -p Restart -p RestartUSec
[Service]
Restart=on-failure
RestartSec=10s
