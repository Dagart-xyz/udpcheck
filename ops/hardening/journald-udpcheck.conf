# Системный журнал хранится не дольше 30 суток (в нём адреса, с которых подбирают вход по SSH; см. политику данных)
[Journal]
MaxRetentionSec=30day
SystemMaxUse=300M
# Копию в rsyslog (/var/log/syslog, auth.log на Ubuntu, хранение около 5 недель) не отдаём: срок держит только этот журнал
ForwardToSyslog=no
